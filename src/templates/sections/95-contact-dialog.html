<dialog id="contact-dialog" class="contact-dialog" aria-labelledby="contact-title">
  <div class="p-6 sm:p-8 bg-white rounded-3xl">
    <div class="flex items-start justify-between gap-4 mb-6">
      <div>
        <p class="text-xs font-bold tracking-widest uppercase text-lime-700 mb-2">Get involved</p>
        <h2 id="contact-title" class="text-2xl font-semibold text-gray-900">Contact GreenCare</h2>
      </div>
      <button type="button" data-close-contact class="w-10 h-10 rounded-full border border-gray-200 text-xl leading-none hover:bg-gray-100" aria-label="Close contact form">×</button>
    </div>
    <p class="text-sm leading-relaxed text-gray-600 mb-6">Tell us how you would like to help. Our community team will respond within 48 hours.</p>
    <form class="space-y-4" novalidate>
      <label class="block text-sm font-semibold text-gray-800" for="contact-name">Your name
        <input id="contact-name" name="name" required autocomplete="name" class="mt-1.5 w-full rounded-xl border border-gray-300 px-3 py-2.5 font-normal focus:border-lime-600" />
      </label>
      <label class="block text-sm font-semibold text-gray-800" for="contact-email">Email address
        <input id="contact-email" name="email" type="email" required autocomplete="email" class="mt-1.5 w-full rounded-xl border border-gray-300 px-3 py-2.5 font-normal focus:border-lime-600" />
      </label>
      <label class="block text-sm font-semibold text-gray-800" for="contact-message">How would you like to help?
        <textarea id="contact-message" name="message" required rows="4" class="mt-1.5 w-full rounded-xl border border-gray-300 px-3 py-2.5 font-normal focus:border-lime-600"></textarea>
      </label>
      <button class="w-full rounded-full bg-gray-900 px-5 py-3 text-sm font-bold text-white hover:bg-gray-800" type="submit">Send message</button>
    </form>
  </div>
</dialog>
