<aside id="cookie-consent" class="cookie-consent" hidden aria-label="Cookie notice">
  <div>
    <p class="text-sm font-bold text-gray-900">A little cookie notice</p>
    <p class="text-xs leading-relaxed text-gray-600 mt-1">We use essential cookies to keep GreenCare secure and remember your preferences. Optional analytics cookies help us improve the experience.</p>
  </div>
  <div class="cookie-consent__actions">
    <button type="button" data-cookie-settings class="cookie-link">Manage preferences</button>
    <button type="button" data-cookie-essential class="cookie-button cookie-button--quiet">Essential only</button>
    <button type="button" data-cookie-accept class="cookie-button">Accept all</button>
  </div>
</aside>
<dialog id="cookie-dialog" class="cookie-dialog" aria-labelledby="cookie-title">
  <div class="p-6 sm:p-8 bg-white rounded-3xl">
    <div class="flex items-start justify-between gap-4 mb-5"><div><p class="text-xs font-bold tracking-widest uppercase text-lime-700 mb-2">Your choices</p><h2 id="cookie-title" class="text-2xl font-semibold text-gray-900">Cookie preferences</h2></div><button type="button" data-cookie-close class="drawer-close" aria-label="Close cookie preferences">×</button></div>
    <p class="text-sm leading-relaxed text-gray-600 mb-6">Essential cookies are always on. You can choose whether to allow optional measurement cookies.</p>
    <label class="cookie-option"><span><strong>Essential cookies</strong><small>Required for security and site preferences.</small></span><input type="checkbox" checked disabled aria-label="Essential cookies always enabled"></label>
    <label class="cookie-option"><span><strong>Analytics cookies</strong><small>Help us understand which pages are useful.</small></span><input type="checkbox" data-cookie-analytics aria-label="Allow analytics cookies"></label>
    <div class="mt-6 flex justify-end gap-2"><button type="button" data-cookie-close class="cookie-button cookie-button--quiet">Cancel</button><button type="button" data-cookie-save class="cookie-button">Save choices</button></div>
  </div>
</dialog>
